name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only. The test job never needs to mutate anything.
permissions:
  contents: read

# Run the bundled JS actions on Node 24 (pinned majors still ship Node 20,
# deprecated by GitHub mid-2026). GitHub's documented opt-in.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest -v --tb=short -rfE

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src tests

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build CSS assets (catches a broken Tailwind build)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- src/qobuz_librarian/web/static/dist/app.css

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the Python wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/qobuz-wheel .

      - name: Check packaged web assets
        run: python scripts/check_wheel_assets.py /tmp/qobuz-wheel/*.whl

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nothing else builds the image until docker.yml runs, and that only fires
      # on release:published. A Dockerfile or image-lock.txt that no longer
      # resolves would surface with the release already public and no image
      # behind it. Build only, so this needs no registry credentials.
      - name: Check runtime dependency pins
        run: python3 scripts/check_image_lock.py

      - name: Test the runtime dependency set
        run: docker build --target test .

      - name: Build the runtime image (no push)
        run: docker build .

  destructive-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app and the audio tools the gate drives
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg flac
          python -m pip install --upgrade pip
          pip install -e .

      # Proves downsample, repair and the gap-fill backup can't eat files,
      # against real ffmpeg/flac. It lives outside pytest on purpose, and
      # nothing ran it automatically before, which is exactly how the harness
      # itself once went stale with a check that couldn't fail.
      - name: Run the destructive-op checks
        run: python scripts/e2e_destructive_check.py
