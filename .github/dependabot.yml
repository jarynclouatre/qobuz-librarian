# Monthly grouped version checks keep dependency updates reviewable.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
    # Pydantic pins this package exactly, so they must move together.
    ignore:
      - dependency-name: pydantic-core
    # pip picks up every .txt one level down, which includes the image lock.
    # Refresh the resolved image lock with scripts/lock-image-deps.sh rather
    # than updating its pins independently.
    exclude-paths:
      - docker/image-lock.txt
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      build-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
