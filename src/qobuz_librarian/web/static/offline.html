<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — Qobuz Librarian</title>
  <!-- Separate cached file, not an inline block: the CSP allows scripts from
       'self' but inline ones need a per-request nonce this static page can't
       mint. It only applies the saved theme; the page works without it. -->
  <script src="/static/offline.js"></script>
  <style>
    /* The app's own tokens, inlined: this page renders with no network and no
       stylesheet, so it carries the values (tokens.css night/winter) itself. */
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/static/vendor/fraunces/fraunces-latin-600.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url("/static/vendor/inter/inter-latin.woff2") format("woff2");
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --ql-bg: #0f0b07;
      --ql-text: #f3ead7;
      --ql-text-2: #b9a888;
      --ql-gold: #e4a94e;
      --ql-gold-ink: #231604;
      --btn-grad: linear-gradient(180deg, #f4c473 0%, #e4a94e 45%, #c98a28 100%);
    }
    :root[data-theme="winter"] {
      color-scheme: light;
      --ql-bg: #f3ecdf;
      --ql-text: #2b2013;
      --ql-text-2: #6d5a41;
      --ql-gold: #b97e1e;
      --ql-gold-ink: #fff8e9;
      --btn-grad: linear-gradient(180deg, #d59a3a 0%, #bc7f1c 55%, #a86b12 100%);
    }
    /* Before the script has run (or without it), follow the device. */
    @media (prefers-color-scheme: light) {
      :root:not([data-theme]) {
        color-scheme: light;
        --ql-bg: #f3ecdf;
        --ql-text: #2b2013;
        --ql-text-2: #6d5a41;
        --ql-gold: #b97e1e;
        --ql-gold-ink: #fff8e9;
        --btn-grad: linear-gradient(180deg, #d59a3a 0%, #bc7f1c 55%, #a86b12 100%);
      }
    }
    body {
      background: var(--ql-bg);
      color: var(--ql-text);
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }
    .card {
      text-align: center;
      max-width: 380px;
      padding: 2.5rem 2rem;
    }
    .mark {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 1.1rem;
    }
    h1 {
      font-family: "Fraunces", "Iowan Old Style", Georgia, ui-serif, serif;
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--ql-gold);
      margin-bottom: 0.75rem;
    }
    p { line-height: 1.6; color: var(--ql-text-2); }
    .retry-btn {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.55rem 1.75rem;
      background: var(--btn-grad);
      color: var(--ql-gold-ink);
      border: 1px solid rgba(0, 0, 0, 0.3);
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35),
                  inset 0 -1px 0 rgba(0, 0, 0, 0.18);
    }
  </style>
</head>
<body>
  <!-- Retry is a plain navigation with an empty href — the current address.
       The service worker serves this page UNDER the URL that failed, so an
       empty href retries that exact page instead of dumping the user on /.
       No JS needed, works offline, stays within the CSP. -->
  <div class="card">
    <img class="mark" src="/static/icon-192.png" alt="">
    <h1>Qobuz Librarian</h1>
    <p>Can't reach Qobuz Librarian. You may be off the network — check your
       connection, or that the server is running.</p>
    <a href="" class="retry-btn">Retry</a>
  </div>
</body>
</html>
