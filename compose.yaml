services:
  qobuz-librarian:
    image: dinkeyes/qobuz-librarian:latest
    container_name: qobuz-librarian
    restart: unless-stopped
    # Run tini as PID 1 so cancelled streamrip children are reaped cleanly.
    init: true
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    ports:
      # WEB_PORT (from .env) only changes the host-side mapping; the
      # container always listens on 8666 internally. WEB_BIND sets the host
      # interface the port is published on. Leave it 0.0.0.0 for LAN access, or
      # set WEB_BIND=127.0.0.1 in .env to keep the UI reachable only from the
      # Docker host. WEB_HOST is the in-container bind and must stay 0.0.0.0
      # for Docker port publishing.
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8666}:8666"

    environment:
      # ── User / permissions ────────────────────────────────────────────────
      # The app runs as PUID:PGID (default 1000:1000) so downloaded and
      # imported files aren't root-owned. Set these to match the host user
      # that owns your media (find your values with `id -u` / `id -g`) by
      # putting PUID/PGID in .env. PUID=0 PGID=0 runs as root if you need it.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Writable home for tools when the root filesystem is read-only.
      # Keep /tmp unless the matching tmpfs mount is changed too.
      APP_HOME: "${APP_HOME:-/tmp}"
      # Timezone for timestamps in History and the job pages ("2 hr ago"
      # stays right either way; exact times follow this). IANA name, e.g.
      # America/Edmonton. Empty = UTC.
      TZ: "${TZ:-}"

      # ── Auth ──────────────────────────────────────────────────────────────
      # Optional: set QOBUZ_USER_AUTH_TOKEN / QOBUZ_USER_ID in .env, or use
      # the Settings page in the web UI. Empty = use the Settings page.
      QOBUZ_USER_AUTH_TOKEN: "${QOBUZ_USER_AUTH_TOKEN:-}"
      QOBUZ_USER_ID:         "${QOBUZ_USER_ID:-}"
      # To keep the token out of the container environment (and `docker
      # inspect`), point this at a file containing only the token (e.g. a Docker
      # secret) instead of setting QOBUZ_USER_AUTH_TOKEN above:
      #   QOBUZ_USER_AUTH_TOKEN_FILE: /run/secrets/qobuz_token
      # (add the matching `secrets:` block + a top-level `secrets:` definition).
      QOBUZ_USER_AUTH_TOKEN_FILE: "${QOBUZ_USER_AUTH_TOKEN_FILE:-}"

      # ── Paths ─────────────────────────────────────────────────────────────
      MUSIC_ROOT:           /music
      STAGING_DIR:          /staging
      DATA_DIR:             /data
      UPGRADE_BACKUP_DIR:   /upgrade_backups
      # One-time Migrate tool. Leave unset unless you have mounted source and
      # destination folders for migration; see docs/existing-libraries.md.
      MIGRATE_SRC:          "${MIGRATE_SRC:-}"
      MIGRATE_DEST:         "${MIGRATE_DEST:-}"

      # beets (bundled, no separate container needed)
      BEETS_CONFIG_DIR:     /config/beets
      BEETS_DB_PATH:        /config/beets/musiclibrary.db
      # Optional folder/file naming. Empty = use the fully-editable
      # /config/beets/config.yaml. beets path syntax ($albumartist, $album,
      # $year, $track, $title, ...). Set in .env (escape $ as $$ if needed).
      BEETS_PATH_DEFAULT:   "${BEETS_PATH_DEFAULT:-}"
      BEETS_PATH_SINGLETON: "${BEETS_PATH_SINGLETON:-}"
      BEETS_PATH_COMP:      "${BEETS_PATH_COMP:-}"
      # Comma-separated list of beets plugins. Empty = honour /config/beets/
      # config.yaml. A custom list replaces its choices for managed imports;
      # the app adds inline, artwork requirements, and its import guards.
      # Useful choices: lastgenre, replaygain, scrub, edit, embedart.
      BEETS_PLUGINS: "${BEETS_PLUGINS:-}"

      # streamrip config (generated on first run)
      STREAMRIP_CONFIG:     /config/streamrip/config.toml

      # ── Web UI ─────────────────────────────────────────────────────────────
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8666"
      # Login. Unset (or any value other than "none") = the UI prompts you to
      # set a username/password on first visit and requires sign-in after.
      # "none" turns the login off entirely; only safe on a trusted network or
      # behind your own authenticating reverse proxy.
      WEB_AUTH: "${WEB_AUTH:-}"
      # Optionally seed the login from .env instead of the first-visit setup
      # screen; provide BOTH (they also act as a password reset on restart).
      # Passwords need at least 15 characters; common values are refused.
      # Empty = use the setup screen. An env value is visible to `docker inspect`.
      WEB_AUTH_USER:     "${WEB_AUTH_USER:-}"
      WEB_AUTH_PASSWORD: "${WEB_AUTH_PASSWORD:-}"
      # Or keep the password out of the environment by pointing this at a file
      # containing only the password (e.g. a Docker secret), mirroring the Qobuz
      # token file. Empty = use the values above / the setup screen.
      WEB_AUTH_PASSWORD_FILE: "${WEB_AUTH_PASSWORD_FILE:-}"
      # Behind a reverse proxy, set this to the proxy's IP(s) so the failed-login
      # throttle keys on the real client IP instead of the shared proxy address.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      # Refuse downloads/scans at startup if /music or /staging aren't writable
      # by the container user (typical on a NAS with the wrong PUID/PGID).
      # Set QL_CHECK_VOLUMES=0 in .env for a read-only (:ro) /music share.
      QL_CHECK_VOLUMES: ${QL_CHECK_VOLUMES:-1}
      # Terminal-first mode: set QL_CLI_ONLY=1 in .env to start in terminal
      # mode (web UI serves but its downloads stay paused). Empty = web app.
      # Or hand off case-by-case from Settings → Mode in the web UI.
      QL_CLI_ONLY: "${QL_CLI_ONLY:-}"
      # ── Qobuz API ─────────────────────────────────────────────────────────
      QOBUZ_API_BASE: https://www.qobuz.com/api.json/0.2
      QOBUZ_APP_ID:   "798273057"

      # ── Tuning (override in .env; the values here are the defaults) ─────────
      RIP_TIMEOUT:               "${RIP_TIMEOUT:-900}"            # per-album rip subprocess timeout (s)
      DELAY_BETWEEN:             "${DELAY_BETWEEN:-1.0}"          # pause between consecutive album downloads (s)
      ARTIST_API_DELAY:          "${ARTIST_API_DELAY:-0.0}"      # pause between Qobuz API calls during library walks (s)
      ARTIST_SCAN_WORKERS:       "${ARTIST_SCAN_WORKERS:-4}"     # parallel artist lookups during a library scan (1-16)
      SEARCH_LIMIT:              "${SEARCH_LIMIT:-25}"           # search results per query
      ARTIST_CATALOG_LIMIT:      "${ARTIST_CATALOG_LIMIT:-1000}" # max albums fetched per artist
      MISSING_ALBUMS_MIN_TRACKS: "${MISSING_ALBUMS_MIN_TRACKS:-4}"  # hide singles / very short EPs in the missing-albums step

      # ── Download quality ──────────────────────────────────────────────────
      # streamrip quality: 2=CD/16-bit lossless, 3=24-bit ≤96kHz,
      # 4=24-bit ≤192kHz. Default 4 = the highest quality Qobuz has per release.
      # Set "2" for CD lossless if you'd rather have smaller files.
      STREAMRIP_QUALITY: "${STREAMRIP_QUALITY:-4}"

      # ── Lyrics ────────────────────────────────────────────────────────────
      # Lyrics are fetched on every import by default. Set "false" to disable.
      # LYRICS_FORMAT: embed (FLAC tag), sidecar (.lrc file), or both.
      # LYRICS_PROVIDERS: comma list in preferred order; empty = built-in.
      LYRICS_ENABLED: "${LYRICS_ENABLED:-true}"
      LYRICS_FORMAT: "${LYRICS_FORMAT:-embed}"
      LYRICS_PROVIDERS: "${LYRICS_PROVIDERS:-}"
      LYRICS_PROVIDER_TIMEOUT: "${LYRICS_PROVIDER_TIMEOUT:-30}"

      # ── Behaviour (also editable on the Settings page) ────────────────────
      # Pick the hi-res master when an album has multiple versions.
      PREFER_HIRES: "${PREFER_HIRES:-true}"
      # After import, merge sibling/duplicate album folders. CLI-only and
      # prompts per folder; off by default (it moves folders). Set "true"
      # if you want it offered on CLI runs.
      CONSOLIDATE: "${CONSOLIDATE:-false}"
      # Move "Primary, Other/<album>" into "Primary/<album>" after import.
      MIGRATE_MULTI_ARTIST: "${MIGRATE_MULTI_ARTIST:-false}"
      # Cover art placement: sidecar (image beside tracks) | embed | both.
      ARTWORK: "${ARTWORK:-sidecar}"

      # ── New releases ──────────────────────────────────────────────────────
      # First launch offers a baseline library scan. It lists missing albums and
      # establishes the new-release baseline (resuming if interrupted). "false"
      # skips the offer; a manual library scan still seeds the baseline.
      AUTO_LIBRARY_SCAN: "${AUTO_LIBRARY_SCAN:-true}"
      # Auto-check for new releases by your library's artists this often
      # (seconds), surfaced on the dashboard once the baseline's set. 0 = off.
      # Also tunable on the Settings page.
      NEW_RELEASE_CHECK_INTERVAL: "${NEW_RELEASE_CHECK_INTERVAL:-86400}"
      # Only flag albums released within this many days as "new" (0 = any catalogue
      # newcomer counts, including older releases Qobuz recently added). Default 365.
      NEW_RELEASE_MAX_AGE_DAYS: "${NEW_RELEASE_MAX_AGE_DAYS:-365}"
      # How long (seconds) a gap scan reuses a fetched discography before
      # re-fetching. The new-release check always fetches fresh regardless.
      ARTIST_CATALOG_CACHE_TTL: "${ARTIST_CATALOG_CACHE_TTL:-604800}"

      # ── Optional features (off by default) ────────────────────────────────
      # Hide the Upgrade page and skip quality-upgrade scanning entirely.
      UPGRADE_SCAN_ENABLED: "${UPGRADE_SCAN_ENABLED:-true}"
      # Let an ordinary CLI download or gap-fill run also upgrade an album Qobuz
      # can now serve better. The CLI asks before replacing the whole folder.
      # Ordinary web downloads keep the selected edition; the Upgrade page
      # reviews replacements before anything moves.
      AUTO_UPGRADE_ENABLED: "${AUTO_UPGRADE_ENABLED:-false}"
      UPGRADE_BACKUP_RETENTION_DAYS: "${UPGRADE_BACKUP_RETENTION_DAYS:-7}"
      # Let the Upgrade walk also re-rip tracks downloaded as singles (off = leave
      # deliberate one-off singles alone).
      UPGRADE_SINGLES_ENABLED: "${UPGRADE_SINGLES_ENABLED:-false}"
      # How long (days) to remember that Qobuz delivered a partial hi-res for
      # an album before retrying it in the upgrade walk.
      CAPPED_RETENTION_DAYS: "${CAPPED_RETENTION_DAYS:-90}"
      # Downsample hi-res FLACs to 44.1/48 kHz before import to save space.
      # Leave false to keep whatever Qobuz delivers (CD quality is fine).
      DOWNSAMPLE_HIRES_ENABLED: "${DOWNSAMPLE_HIRES_ENABLED:-false}"
      # What the on-demand Downsample does with each hi-res original: keep a
      # restorable copy (Settings, for UPGRADE_BACKUP_RETENTION_DAYS) or delete
      # to save space. Leave unset to be asked on the first downsample.
      DOWNSAMPLE_KEEP_ORIGINALS: "${DOWNSAMPLE_KEEP_ORIGINALS:-}"

      # ── Matching thresholds (advanced) ──────────────────────────────────
      # Similarity score (0–1) for fuzzy directory-name matching.
      # Lower = more permissive, more false positives.
      FUZZY_DIR_THRESH:           "${FUZZY_DIR_THRESH:-0.78}"
      ARTIST_NAME_THRESH:         "${ARTIST_NAME_THRESH:-0.85}"
      ARTIST_DIR_MATCH_THRESH:    "${ARTIST_DIR_MATCH_THRESH:-0.65}"
      CONSOLIDATE_THRESH:         "${CONSOLIDATE_THRESH:-0.70}"
      AUTO_SAFE_TITLE_SIM_THRESH: "${AUTO_SAFE_TITLE_SIM_THRESH:-0.85}"

      # ── Advanced overrides ──────────────────────────────────────────────
      # beets import guard: seconds of no-output before a stalled import is
      # killed and quarantined, retry count, and pause between attempts.
      BEETS_TIMEOUT:         "${BEETS_TIMEOUT:-600}"
      BEETS_MAX_ATTEMPTS:    "${BEETS_MAX_ATTEMPTS:-2}"
      BEETS_RETRY_PAUSE:     "${BEETS_RETRY_PAUSE:-30}"
      # Cooldown (seconds) after Qobuz rate-limits the account.
      RATE_LIMIT_COOLDOWN:   "${RATE_LIMIT_COOLDOWN:-30}"
      # Parallel ffmpeg workers for the on-demand downsample (CPU-bound).
      RESAMPLE_WORKERS:      "${RESAMPLE_WORKERS:-4}"
      # Free-space floor (MB) checked before each album download; turns a
      # near-full staging area into a clean disk-full stop. 0 disables it.
      MIN_FREE_STAGING_MB:   "${MIN_FREE_STAGING_MB:-500}"
      # Repair scan: minimum gap (s) between live Qobuz ISRC lookups, and the
      # on-disk ISRC-lookup cache (files are still decode-tested fresh each scan).
      REPAIR_LOOKUP_MIN_INTERVAL: "${REPAIR_LOOKUP_MIN_INTERVAL:-0.05}"
      REPAIR_CACHE_ENABLED:       "${REPAIR_CACHE_ENABLED:-true}"
      REPAIR_CACHE_TTL_DAYS:      "${REPAIR_CACHE_TTL_DAYS:-30}"
      # Drop obvious live/tour/session releases from the missing-albums gap list.
      EXCLUDE_LIVE_ALBUMS:   "${EXCLUDE_LIVE_ALBUMS:-false}"
      # Log verbosity: DEBUG | INFO | WARNING | ERROR.
      LOG_LEVEL:             "${LOG_LEVEL:-INFO}"
      # Optional command run after every job; the job state (id, status, title,
      # edition, display_title, artist, error, finished_at) arrives as JSON on stdin
      # (e.g. POST_JOB_HOOK='curl -sX POST https://ntfy.sh/your-topic -d @-').
      # POST_JOB_HOOK_TIMEOUT caps a slow webhook.
      POST_JOB_HOOK:         "${POST_JOB_HOOK:-}"
      POST_JOB_HOOK_TIMEOUT: "${POST_JOB_HOOK_TIMEOUT:-10}"

      # ── Web request budgets ───────────────────────────────────────────────
      # Per-request timeout (seconds) for the web UI's Qobuz API calls.
      # QL_WEB_FETCH_TIMEOUT bounds album/track fetches and the search box;
      # QL_WEB_TEST_AUTH_TIMEOUT bounds the startup + Settings token probe.
      QL_WEB_FETCH_TIMEOUT:     "${QL_WEB_FETCH_TIMEOUT:-12.0}"
      QL_WEB_TEST_AUTH_TIMEOUT: "${QL_WEB_TEST_AUTH_TIMEOUT:-8.0}"

      # Web live-update streams. Each open progress or review stream uses a
      # worker while it waits; heartbeat ticks are 0.5 seconds each.
      SSE_MAX_WORKERS:     "${SSE_MAX_WORKERS:-16}"
      SSE_HEARTBEAT_TICKS: "${SSE_HEARTBEAT_TICKS:-30}"

    volumes:
      # Host paths come from a .env file (see .env.example). Defaults to
      # ./music, ./staging, ./upgrade_backups so a fresh clone runs as-is.
      # Music library (read-write so beets can move files in)
      - ${QL_MUSIC_DIR:-./music}:/music
      # Staging area for streamrip downloads
      - ${QL_STAGING_DIR:-./staging}:/staging
      # Persistent config: beets db, streamrip config, app state
      - qobuz-librarian-config:/config
      # App data: fetch log, queue persistence, repair log
      - qobuz-librarian-data:/data
      # Upgrade backups
      - ${QL_UPGRADE_BACKUPS:-./upgrade_backups}:/upgrade_backups

volumes:
  qobuz-librarian-config:
    name: qobuz-librarian-config
  qobuz-librarian-data:
    name: qobuz-librarian-data
