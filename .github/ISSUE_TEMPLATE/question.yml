name: Question / help
description: Setup help or "how do I…"
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Bottom of the sidebar in the web UI, or `qobuz-librarian --version`.
  - type: markdown
    attributes:
      value: The [configuration](https://github.com/jarynclouatre/qobuz-librarian/blob/main/docs/configuration.md) and [troubleshooting](https://github.com/jarynclouatre/qobuz-librarian/blob/main/docs/troubleshooting.md) docs cover the common ones - worth a skim first.
