<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Qobuz Librarian</title>
  <link rel="icon" type="image/png" href="/static/icon.png?v={{ asset_version }}">
  <script nonce="{{ request.state.csp_nonce }}">
    (function () {
      try {
        var t = localStorage.getItem('ql-theme');
        if (t !== 'night' && t !== 'winter') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'winter' : 'night';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link href="/static/dist/app.css?v={{ asset_version }}" rel="stylesheet">
  <script src="/static/app.js?v={{ asset_version }}"></script>
</head>
<body class="ql-auth-page">
  <main class="ql-auth-panel ql-auth-panel-login">
    <div class="ql-auth-body">
      <div class="ql-auth-brand">
        <img src="/static/qobuz-librarian-mark.png?v={{ asset_version }}" alt="" class="ql-auth-logo">
        <div class="ql-auth-title">
          <h1>Qobuz Librarian</h1>
          <p>Sign in to manage your library.</p>
        </div>
      </div>

      {% if error %}
      <div class="ql-notice ql-notice-error"><span>{{ error }}</span></div>
      {% endif %}

      {% from "_secret_toggle.html" import secret_toggle %}
      <form action="/login" method="post" class="ql-auth-form">
        <input type="hidden" name="_csrf_token" value="{{ request.state.csrf_token }}">
        {% if next_path %}<input type="hidden" name="next" value="{{ next_path }}">{% endif %}
        <div class="ql-field">
          <label class="ql-field-label" for="username">Username</label>
          <input type="text" name="username" id="username" autocomplete="username"
                 value="{{ username | default('', true) }}" required
                 autofocus class="ql-input">
        </div>
        <div class="ql-field">
          <label class="ql-field-label" for="password">Password</label>
          <div class="relative">
            <input type="password" name="password" id="password" required
                   autocomplete="current-password" class="ql-input pr-12">
            {{ secret_toggle("password", "password") }}
          </div>
        </div>
        <button type="submit" class="ql-btn ql-btn-primary w-full">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
