{% macro secret_toggle(target, noun) -%}
<button type="button"
        class="ql-secret-toggle"
        aria-label="Show {{ noun }}"
        title="Show {{ noun }}"
        aria-pressed="false"
        data-toggle-password="{{ target }}"
        data-show-label="Show {{ noun }}"
        data-hide-label="Hide {{ noun }}">
  <svg data-icon-show xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
       viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
  </svg>
  <svg data-icon-hide xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5" fill="none"
       viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
          d="M3 3l18 18M10.58 10.58A3 3 0 0012 15a3 3 0 002.42-1.24M9.88 4.24A10.45 10.45 0 0112 4c4.478 0 8.268 2.943 9.542 7a11.1 11.1 0 01-3.04 4.42M6.61 6.61A11.1 11.1 0 002.458 12C3.732 16.057 7.523 19 12 19c1.43 0 2.798-.285 4.06-.803"/>
  </svg>
  <span class="sr-only" data-toggle-password-label>Show {{ noun }}</span>
</button>
{%- endmacro %}
