{% for c in items %}
<label class="ql-review-candidate{% if job.execute_kind == 'repair' %} ql-review-candidate--note{% endif %}">
  <input type="checkbox" class="ql-checkbox cb" name="cid"
         value="{{ c.cid }}" data-seq="{{ c.seq }}"
         {% if c.selected %}checked{% endif %}>
  {% set _cover = review_cover(job, c) %}
  {% if _cover %}
  <img src="{{ _cover }}" alt="" loading="lazy" width="46" height="46"
       class="ql-review-cover">
  {% else %}
  {# A record, so a row with no artwork reads as an album the app found no
     cover for rather than a picture that failed to load. #}
  <span class="ql-review-cover ql-review-cover--empty" aria-hidden="true">
    <svg viewBox="0 0 24 24" class="ql-review-cover-mark"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/></svg>
  </span>
  {% endif %}
  <span class="ql-review-candidate-body">
    <span class="ql-review-candidate-heading">
      <span class="ql-review-candidate-title">{{ c.payload.album if job.execute_kind == 'downsample' and c.payload.album else c.title }}</span>{% if c.payload.is_new %}
      <span class="ql-badge ql-badge-new ql-badge-xs">new</span>{% endif %}{% if c.payload.version %}
      <span class="ql-sub-version">{{ c.payload.version }}</span>{% endif %}{% if c.payload.explicit %}
      <span class="ql-sub-version">Explicit</span>{% endif %}
    </span>
    {% set _release_label = {'live': 'Live', 'compilation': 'Compilation', 'epSingle': 'EP or single'}.get(c.payload.release_type) if review_tab|default('') == 'missing' %}
    {% if _release_label and (c.payload.version or '') | lower == _release_label | lower %}{% set _release_label = '' %}{% endif %}
    {% set _detail = (c.detail | replace('gap-fill: ', '')) if review_tab|default('') == 'gaps' else c.detail %}
    {# Each "·" part stays on one line, so "24-bit/96kHz" or "9 missing of
       10" never breaks inside on a phone. #}
    <span class="ql-review-candidate-detail">{% if _release_label %}{{ _release_label }} · {% endif %}{% if job.execute_kind in ('upgrade', 'downsample') and c.payload.year | known_year %}{{ c.payload.year | known_year }} · {% endif %}{% if job.execute_kind == 'repair' %}{{ _detail }}{% else %}{% for _part in (_detail or '').split(' · ') %}{% if not loop.first %} · {% endif %}{% if loop.first and _part | length == 4 and _part.isdigit() and not _part | known_year %}{% set _part = '?' %}{% endif %}{% for _step in _part.split(' → ') %}{% if not loop.first %} {% endif %}<span class="whitespace-nowrap">{% if not loop.first %}→ {% endif %}{{ _step }}</span>{% endfor %}{% endfor %}{% endif %}</span>
    {% if c.payload.verified_truncated %}
    <span class="ql-review-truncated">
      {% for t in c.payload.verified_truncated[:12] %}
      <span class="ql-review-truncated-line">
        <span class="readout ql-review-track-number">{% if t.local_track_number or t.track_number %}{{ '%02d'|format(t.local_track_number or t.track_number) }}{% else %}··{% endif %}</span>
        {{ t.local_title or t.title }}{% if t.reason == 'decode_failed' %} <span class="ql-review-truncated-muted">· won't decode</span>{% endif %}
      </span>
      {% endfor %}
      {% if (c.payload.verified_truncated | length) > 12 %}
      <span class="ql-review-truncated-more">+{{ (c.payload.verified_truncated | length) - 12 }} more</span>
      {% endif %}
    </span>
    {% endif %}
  </span>
</label>
{% endfor %}
