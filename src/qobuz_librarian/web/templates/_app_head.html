<link rel="icon" type="image/png" href="/static/icon-192.png?v={{ asset_version }}">
<link rel="apple-touch-icon" href="/static/icon-192.png?v={{ asset_version }}">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f0b07">
<script nonce="{{ request.state.csp_nonce }}">
  (function () {
    try {
      var t = localStorage.getItem('ql-theme');
      if (t !== 'night' && t !== 'winter') {
        t = matchMedia('(prefers-color-scheme: light)').matches ? 'winter' : 'night';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'winter' ? '#f3ecdf' : '#0f0b07');
    } catch (e) {}
  })();
</script>
<script nonce="{{ request.state.csp_nonce }}">
  // Registered from the shared head rather than the app shell. Sign-in and
  // setup are standalone pages, and registering only in the shell left anyone
  // who had not signed in yet with no cached offline page to fall back on.
  if ('serviceWorker' in navigator) {
    // The content hash invalidates the service-worker cache.
    navigator.serviceWorker.register('/sw.js?v={{ asset_version }}');
  }
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qobuz Librarian">
