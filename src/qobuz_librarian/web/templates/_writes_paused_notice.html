{# Terminal mode carries its own banner on every page, so this would repeat it. #}
{% if writes_paused_notice and not cli_mode %}
<div class="ql-notice ql-notice-warning flex items-start flex-wrap gap-3 p-4">
  <span class="min-w-0 break-words text-sm">{{ writes_paused_notice.msg }}</span>
  {% if writes_paused_notice.action %}
  <a href="{{ writes_paused_notice.action.href }}" class="ql-btn ql-btn-secondary ql-btn-sm">{{ writes_paused_notice.action.label }}</a>
  {% endif %}
</div>
{% endif %}
